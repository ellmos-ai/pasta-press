[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pasta-press"
version = "1.2.2"
description = "Stylistic text refinement, paraphrasing and translation via local Ollama instances"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Lukas Geiger" }]
keywords = ["text-refinement", "paraphrasing", "ollama", "local-llm", "markdown", "translation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "requests>=2.28",
  "click>=8.0",
]

[project.optional-dependencies]
pandoc = ["pypandoc>=1.11"]
all = ["pypandoc>=1.11"]
test = ["pytest>=8.0", "ruff>=0.6", "tomli>=2.0; python_version < \"3.11\""]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pypandoc>=1.11",
  "tomli>=2.0; python_version < \"3.11\"",
]

[project.scripts]
pastapress = "pastapress.cli:cli"

[project.urls]
Repository = "https://github.com/ellmos-ai/pasta-press"
Issues = "https://github.com/ellmos-ai/pasta-press/issues"
Documentation = "https://github.com/ellmos-ai/pasta-press#readme"
"German Documentation" = "https://github.com/ellmos-ai/pasta-press/blob/master/README.de.md"
"Security Policy" = "https://github.com/ellmos-ai/pasta-press/blob/master/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/pasta-press/blob/master/THIRD_PARTY_LICENSES.md"
"LLM Context Index" = "https://github.com/ellmos-ai/pasta-press/blob/master/llms.txt"
"Marketing Log" = "https://github.com/ellmos-ai/pasta-press/blob/master/MARKETING-LOG.txt"

[tool.setuptools]
packages = ["pastapress"]

[tool.pytest.ini_options]
addopts = "-ra -v"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
